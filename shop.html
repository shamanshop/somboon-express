<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>SOMBOON EXPRESS Shop</title><style>body{font-family:sans-serif;background:#f1f5f9;margin:0;padding:20px;color:#0f172a}.wrap{max-width:1050px;margin:0 auto}.top{background:#0f172a;color:#fff;padding:16px 20px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.bal{background:#059669;padding:8px 14px;border-radius:8px;font-weight:bold}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.card{background:#fff;padding:18px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.05)}.row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}input{padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px}input[type=text]{flex:1;min-width:200px}input[type=number]{width:100px}button{padding:8px 14px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;background:#2563eb;color:#fff}button.g{background:#059669}button.a{background:#d97706}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #e2e8f0;padding:8px;text-align:left}th{background:#f8fafc}</style></head><body><div class="wrap"><div class="top"><div>SOMBOON EXPRESS - Shop</div><div class="bal">Balance: <span id="b">0.00</span> THB</div></div><div class="grid"><div class="card"><h3>Fetch Order Item</h3><div class="row"><input id="u" type="text" placeholder="1688 / Taobao / Tmall URL"><input id="r" type="number" step="0.01" value="5.30"><button id="fBtn" type="button">Fetch</button></div><div id="meta" style="margin-bottom:8px;font-weight:bold"></div><table><thead><tr><th>Spec</th><th>CNY</th><th>THB/pc</th><th>Qty</th><th>Total</th></tr></thead><tbody id="tb"><tr><td colspan="5">No data</td></tr></tbody></table><div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center"><div>Total: <strong id="tot">0.00</strong> THB</div><div><button id="payBtn" class="a" type="button">Deduct Balance</button> <button id="cpBtn" class="g" type="button">Copy</button></div></div></div><div class="card"><h3>Topup</h3><div class="row"><input id="amt" type="number" step="0.01" placeholder="THB"><input id="note" type="text" placeholder="Note"><button id="topBtn" class="g" type="button">Add</button></div><div id="logs"></div></div></div></div><script>const K='sb_shop_v3';let st=JSON.parse(localStorage.getItem(K)||'null')||{bal:0,logs:[]};let cur={title:'',shop:'',url:''};let list=[];function save(){localStorage.setItem(K,JSON.stringify(st));drawW();}function drawW(){b.textContent=Number(st.bal||0).toFixed(2);logs.innerHTML=st.logs.map(x=>'<div>'+(x.d>0?'+':'-')+Number(x.a).toFixed(2)+' THB - '+x.n+' ('+x.t+')</div>').join('');}function drawL(){const rt=parseFloat(r.value)||5.3;if(!list.length){tb.innerHTML='<tr><td colspan="5">No data</td></tr>';tot.textContent='0.00';return;}let sum=0;tb.innerHTML=list.map((v,i)=>{const c=Number(v.priceYuan)||0;const u=c*rt;const q=Number(v.qty)||0;const s=u*q;sum+=s;return '<tr><td>'+v.spec+'</td><td>'+c.toFixed(2)+'</td><td>'+u.toFixed(2)+'</td><td><input type="number" min="0" value="'+q+'" onchange="setQ('+i+',this.value)"></td><td>'+s.toFixed(2)+'</td></tr>';}).join('');tot.textContent=sum.toFixed(2);}window.setQ=(i,v)=>{list[i].qty=Math.max(0,parseInt(v,10)||0);drawL();};r.onchange=drawL;topBtn.onclick=()=>{const a=parseFloat(amt.value);if(!a||a<=0)return;st.bal=Number(st.bal||0)+a;st.logs.unshift({d:1,a,n:note.value||'Topup',t:new Date().toLocaleTimeString()});amt.value='';note.value='';save();};payBtn.onclick=()=>{const cost=parseFloat(tot.textContent)||0;if(cost<=0||Number(st.bal||0)<cost)return alert('Check balance/total');st.bal=Number(st.bal||0)-cost;st.logs.unshift({d:-1,a:cost,n:'Order: '+(cur.title||'Item'),t:new Date().toLocaleTimeString()});save();alert('Deducted');};fBtn.onclick=async()=>{const url=u.value.trim();if(!url)return;fBtn.disabled=true;try{const res=await fetch('http://localhost:3002/api/product?url='+encodeURIComponent(url));const d=await res.json();if(!d.ok||!d.product)throw 0;cur={...d.product,url};meta.textContent=(cur.title||'')+' | '+(cur.shop||'');list=(cur.variants||[]).map(v=>({...v,qty:0}));drawL();}catch{alert('Server 3002 not running?');}finally{fBtn.disabled=false;}};cpBtn.onclick=async()=>{const p=list.filter(v=>(Number(v.qty)||0)>0);if(!p.length)return alert('Set qty');const rt=parseFloat(r.value)||5.3;const txt=[cur.title,...p.map(v=>v.spec+' x'+v.qty+' = '+((Number(v.priceYuan)||0)*rt*(Number(v.qty)||0)).toFixed(2)),'TOTAL: '+tot.textContent+' THB',cur.url].filter(Boolean).join('\n');try{await navigator.clipboard.writeText(txt);alert('Copied');}catch{prompt('',txt);}};drawW();drawL();</script></body></html>
